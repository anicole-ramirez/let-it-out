<title>Let it out! – Intro</title>

<style>
html,body{margin:0;height:100%;background:#0E0B09;overflow:hidden;font-family:monospace}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;transform-origin:center;flex-shrink:0;background:#3E4A38}
.wall{position:absolute;inset:0 0 120px 0;background:repeating-linear-gradient(90deg,#4B5A43 0 46px,#556650 46px 58px)}
.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,#0008 100%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:120px;background:repeating-linear-gradient(90deg,#6B4A30 0 158px,#5A3D27 158px 162px);border-top:10px solid #3A2818}
#tv{position:absolute;left:390px;top:170px;width:500px;height:470px;transform-origin:50% 90%}
.ant{position:absolute;height:6px;background:#9A958A;border-radius:3px;transform-origin:0 50%}
.ant i{position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:#C9C4BE}
.antbase{position:absolute;left:215px;top:10px;width:70px;height:22px;background:#8E3A24;border:4px solid #1E1A16;border-bottom:none}
.cab{position:absolute;left:0;top:30px;width:500px;height:320px;background:#C8693A;border:6px solid #E8D9B8;border-radius:16px;box-shadow:inset 0 -10px 0 #A6532A,0 0 0 4px #1E1A16,0 18px 0 #0004}
.bezel{position:absolute;left:22px;top:22px;width:356px;height:272px;background:#1E1A16;border-radius:34px}
.screen{position:absolute;left:14px;top:14px;width:328px;height:244px;border-radius:44px/38px;overflow:hidden;background:#5E6A72}
#noise{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#00000033 0 2px,transparent 2px 4px);pointer-events:none}
.glare{position:absolute;left:20px;top:14px;width:120px;height:60px;border-radius:50%;background:#ffffff1f;transform:rotate(-18deg);pointer-events:none}
#inLogo{position:absolute;left:50%;top:50%;width:280px;transform:translate(-50%,-50%);opacity:0}
#inLogo svg{width:100%;height:auto;display:block}
#welcome{position:absolute;left:0;right:0;top:20px;text-align:center;color:#C9A43A;font:700 16px monospace;letter-spacing:3px;opacity:0}
#cracks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cracks path{fill:none;stroke:#F4EFE4;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.panel{position:absolute;right:20px;top:22px;width:92px;height:272px;background:#E2A64A;border:4px solid #1E1A16;border-radius:10px;box-sizing:border-box}
.grille{position:absolute;left:12px;right:12px;top:14px;height:130px;background:repeating-linear-gradient(0deg,#8E5A1E 0 3px,transparent 3px 8px)}
.dial{position:absolute;left:18px;top:160px;width:48px;height:48px;border-radius:50%;background:#F4EFE4;border:5px solid #A8443A;box-sizing:border-box}
.dial::after{content:"";position:absolute;left:19px;top:2px;width:4px;height:20px;background:#1E1A16;transform-origin:50% 100%;transform:rotate(35deg)}
.knob{position:absolute;top:222px;width:26px;height:26px;border-radius:50%;background:#F4EFE4;border:4px solid #A8443A;box-sizing:border-box}
.leg{position:absolute;top:340px;width:16px;height:130px;background:#6B4A30;border:3px solid #1E1A16;border-radius:4px}
#shards{position:absolute;inset:0;pointer-events:none}
#out{position:absolute;left:0;top:0;width:710px;transform-origin:0 0;opacity:0;pointer-events:none;filter:drop-shadow(0 10px 0 #0006)}
#out svg{width:100%;height:auto;display:block}
#flash{position:absolute;inset:0;background:#FFF6D8;opacity:0;pointer-events:none}
#tag{position:absolute;left:0;right:0;bottom:36px;text-align:center;color:#E8E0C8;font:700 26px monospace;letter-spacing:4px;opacity:0;text-shadow:3px 3px 0 #000}
.spark{position:absolute;width:8px;height:8px;background:#FFD866;box-shadow:0 0 8px #FFB020}
.dust{position:absolute;width:10px;height:10px;background:#D9D2B6}
#replay{position:fixed;right:14px;bottom:14px;font:700 14px monospace;padding:8px 14px;border:3px solid #1E1A16;background:#C9A43A;color:#1E1A16;box-shadow:3px 3px 0 #000;cursor:pointer;z-index:5}

<div id="wrap"><div id="stage">
  <div class="wall"></div><div class="floor"></div>
  <div id="tv">
    <div class="ant" id="a1" style="left:250px;top:20px;width:150px;transform:rotate(-128deg)"><i></i></div>
    <div class="ant" id="a2" style="left:250px;top:20px;width:160px;transform:rotate(-52deg)"><i></i></div>
    <div class="antbase"></div>
    <div class="leg" style="left:60px;transform:rotate(12deg)"></div><div class="leg" style="left:424px;transform:rotate(-12deg)"></div>
    <div class="cab">
      <div class="bezel"><div class="screen" id="screen">
        <canvas id="noise" width="82" height="61"></canvas>
        <div id="welcome">WELCOME TO</div>
        <div id="inLogo"><svg viewBox="0 0 710 530"><use href="#logo" width="710" height="530"/></svg></div>
        <svg id="cracks" viewBox="0 0 328 244"></svg>
        <div class="scan"></div><div class="glare" id="glare"></div>
      </div></div>
      <div class="panel"><div class="grille"></div><div class="dial" id="dial"></div><div class="knob" style="left:10px"></div><div class="knob" style="left:48px"></div></div>
    </div>
  </div>
  <div id="shards"></div>
  <div id="flash"></div>
  <div id="out"><svg viewBox="0 0 710 530"><use href="#logo" width="710" height="530"/></svg></div>
  <div id="tag">PRESS ANY KEY TO TUNE IN</div>
</div></div>
<button id="replay">REPLAY</button>
<script>
const $=s=>document.querySelector(s), stage=$('#stage');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${s})`}addEventListener('resize',fit);fit();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ease='cubic-bezier(.2,.8,.2,1)';
// screen rect on stage: tv(390,170) + cab(0,30)+border6 + bezel(22,22) + screen(14,14)
const SX=390+6+22+14, SY=170+30+6+22+14, SW=328, SH=244, CX=SX+SW/2, CY=SY+SH/2;
let noiseOn=true, run=0;
const nc=$('#noise'),nx=nc.getContext('2d');
(function noise(){if(noiseOn){const d=nx.createImageData(82,61);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}nx.putImageData(d,0,0)}requestAnimationFrame(noise)})();
function crack(n,len){const svg=$('#cracks');let html='';const cx=164+(Math.random()*20-10),cy=122+(Math.random()*16-8);
 for(let k=0;k<n;k++){let a=Math.random()*Math.PI*2,x=cx,y=cy,d=`M${x.toFixed(1)} ${y.toFixed(1)}`;const steps=4+Math.random()*3|0;
  for(let s=0;s<steps;s++){a+=(Math.random()-.5)*.9;const l=len/steps*(0.7+Math.random()*.6);x+=Math.cos(a)*l;y+=Math.sin(a)*l;d+=` L${x.toFixed(1)} ${y.toFixed(1)}`}
  html+=`<path d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`}
 html+=`<circle cx="${cx}" cy="${cy}" r="${len/14}" fill="none" stroke="#F4EFE4" stroke-width="1.5"/>`;
 svg.insertAdjacentHTML('beforeend',html);
 svg.querySelectorAll('path').forEach(p=>{if(p.dataset.d)return;p.dataset.d=1;p.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:220,fill:'forwards',easing:'ease-out'})})}
function thump(power){parent.postMessage({intro:'knock'},location.origin);const tv=$('#tv');
 tv.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${-6*power}px,${-4*power}px) rotate(${-1.6*power}deg)`},{transform:`translate(${5*power}px,0) rotate(${1.2*power}deg)`},{transform:'translate(0,0) rotate(0)'}],{duration:320,easing:'ease-out'});
 $('#inLogo').animate([{transform:'translate(-50%,-50%) scale(1.05)'},{transform:`translate(-50%,-50%) scale(${1.25+.1*power})`},{transform:'translate(-50%,-50%) scale(1.08)'}],{duration:260,fill:'forwards',easing:'ease-out'});
 stage.animate([{transform:stage.style.transform},{transform:stage.style.transform+` translate(${(Math.random()-.5)*10*power}px,${4*power}px)`},{transform:stage.style.transform}],{duration:160});
 ['#a1','#a2'].forEach((s,i)=>{const el=$(s),base=el.style.transform;el.animate([{transform:base},{transform:base+` rotate(${(i?8:-8)*power}deg)`},{transform:base}],{duration:400,easing:'ease-out'})})}
function shatter(){parent.postMessage({intro:'break'},location.origin);const box=$('#shards');box.innerHTML='';
 const pts=[];const per=[[0,0],[SW,0],[SW,SH],[0,SH]];for(let i=0;i<4;i++){const [ax,ay]=per[i],[bx,by]=per[(i+1)%4];const n=5;for(let k=0;k<n;k++){const t=k/n+Math.random()*.08;pts.push([ax+(bx-ax)*t,ay+(by-ay)*t])}}
 const cx=SW/2,cy=SH/2;
 for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];const mx=(p[0]+q[0]+cx)/3,my=(p[1]+q[1]+cy)/3;
  const el=document.createElementNS('http://www.w3.org/2000/svg','svg');el.setAttribute('width',SW);el.setAttribute('height',SH);el.style.cssText=`position:absolute;left:${SX}px;top:${SY}px;overflow:visible`;
  el.innerHTML=`<polygon points="${cx},${cy} ${p[0]},${p[1]} ${q[0]},${q[1]}" fill="#9FB4C0" fill-opacity=".55" stroke="#F4EFE4" stroke-width="2"/>`;box.appendChild(el);
  const dx=mx-cx,dy=my-cy,dl=Math.hypot(dx,dy)||1,f=380+Math.random()*420,r=(Math.random()-.5)*540;
  el.style.transformOrigin=`${mx}px ${my}px`;
  el.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx/dl*f}px,${dy/dl*f+260}px) rotate(${r}deg) scale(.7)`,opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.15,.7,.4,1)',fill:'forwards'})}
 for(let i=0;i<26;i++){const d=document.createElement('div');d.className='dust';d.style.left=CX+'px';d.style.top=CY+'px';box.appendChild(d);const a=Math.random()*Math.PI*2,f=120+Math.random()*380;
  d.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*f}px,${Math.sin(a)*f+200}px) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:800+Math.random()*500,easing:'ease-out',fill:'forwards'})}}
function sparks(id){if(id!==run)return;const box=$('#shards');for(let i=0;i<3;i++){const s=document.createElement('div');s.className='spark';const side=Math.random();s.style.left=(SX+(side<.5?10:SW-14)+Math.random()*6)+'px';s.style.top=(SY+20+Math.random()*(SH-40))+'px';box.appendChild(s);
 s.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${(Math.random()-.5)*70}px,${60+Math.random()*60}px)`,opacity:0}],{duration:500+Math.random()*300,easing:'ease-in',fill:'forwards'}).onfinish=()=>s.remove()}
 setTimeout(()=>sparks(id),220+Math.random()*500)}
async function play(){const id=++run;
 // reset
 noiseOn=true;$('#noise').style.opacity=1;$('#cracks').innerHTML='';$('#shards').innerHTML='';$('#screen').style.background='#5E6A72';$('#glare').style.opacity=1;
 [$('#inLogo'),$('#welcome'),$('#out'),$('#tag')].forEach(e=>{e.getAnimations().forEach(a=>a.cancel());e.style.opacity=0});
 $('#inLogo').style.transform='translate(-50%,-50%)';
 await sleep(900);if(id!==run)return;
 // channel clicks on
 $('#dial').animate([{transform:'rotate(0)'},{transform:'rotate(70deg)'}],{duration:250,fill:'forwards'});
 $('#flash').animate([{opacity:0},{opacity:.35},{opacity:0}],{duration:160});
 noiseOn=false;$('#noise').style.opacity=0;$('#screen').style.background='#141A17';
 for(const o of [1,.2,1,.4,1]){$('#inLogo').style.opacity=o;$('#welcome').style.opacity=o;await sleep(70)}
 await sleep(700);if(id!==run)return;
 // the logo wants out
 $('#welcome').animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});
 for(const [p,n,len,w] of [[1,3,70,520],[1.4,4,110,420],[1.8,6,170,360]]){thump(p);crack(n,len);await sleep(w);if(id!==run)return}
 // tremble
 $('#tv').animate([{transform:'translate(-2px,0)'},{transform:'translate(2px,0)'}],{duration:50,iterations:6});
 $('#inLogo').animate([{transform:'translate(-50%,-50%) scale(1.1)'},{transform:'translate(-50%,-50%) scale(1.45)'}],{duration:300,fill:'forwards',easing:'ease-in'});
 await sleep(300);if(id!==run)return;
 // SHATTER
 $('#flash').animate([{opacity:0},{opacity:.85},{opacity:0}],{duration:260});
 $('#inLogo').style.opacity=0;$('#cracks').innerHTML='';$('#glare').style.opacity=0;$('#screen').style.background='#0B0D0C';
 shatter();
 $('#tv').animate([{transform:'rotate(0) translateY(0)'},{transform:'rotate(-4deg) translateY(8px)'},{transform:'rotate(2deg)'},{transform:'rotate(0)'}],{duration:600,easing:'ease-out'});
 const s0=280/710*1.45, w=710, h=530;
 const out=$('#out');out.style.opacity=1;
 out.animate([
   {transform:`translate(${CX-w*s0/2}px,${CY-h*s0/2}px) scale(${s0})`},
   {transform:`translate(${640-w*1.18/2}px,${300-h*1.18/2}px) scale(1.18)`,offset:.6},
   {transform:`translate(${640-w*.95/2}px,${320-h*.95/2}px) scale(.95)`,offset:.8},
   {transform:`translate(${640-w/2}px,${315-h/2}px) scale(1)`}],{duration:900,easing:'cubic-bezier(.2,.9,.3,1)',fill:'forwards'});
 sparks(id);
 await sleep(1100);if(id!==run)return;
 $('#tag').animate([{opacity:0},{opacity:1},{opacity:.3},{opacity:1}],{duration:1600,iterations:Infinity});
}
$('#replay').onclick=play;
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')play()});
play();
</script>
