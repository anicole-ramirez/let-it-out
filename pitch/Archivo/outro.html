SSSSSSSSSSSK...","...KSKKSSSSSSSSSSKKSK...","...KSSKKSSSSSSSSKKSSK...","...KSSSKSSSSSSSSKSSSK...","...KSRSSSSSssSSSSSRSK...","...KSSSShKKKKhSSSSSSKKKK","...KSSSSSKKKKKKSSSSSKSSK","...KSSSSSKmmmmKSSSSSKSSK","....KsSSSKKKKKKSSSsKKSSK",".....KKsSSSSSSSSsKK.KCCK",".......KKKKKKKKKK..KCCK.",".....KCCCCWTTWCCCCKCCK..","....KCCCCCWTTWCCCCCCK...","...KCCCCCCWTTWCCCCCCK...","...KCcCCCCCTTCCCCCcCK...","...KCcCCCCCTTCCCCCcCK...","...KCcCCCCCCCCCCCCcCK...","..KSSKCCCCCCCCCCCCKK....","..KSSKCCCCCCCCCCCCKK....","...KKKCCCCCCCCCCCCKKK...","......KLLLLLLLLLLK......","......KLLLLKKLLLLK......","......KLLLLKKLLLLK......",".....KKKKKK..KKKKKK....."],"cand_b_idle":["........KKKKKKKK........","......KKHHHHHHHHKK......",".....KHHHHHHHHHHHHK.....","....KHHHHHHHHHHHHHHK....","...KHHhHHHHHHHHHHhHHK...","...KSSSSSSSSSSSSSSSSK...","...KSKKSSSSSSSSSSKKSK...","...KSSKKSSSSSSSSKKSSK...","...KSSSKSSSSSSSSKSSSK...","...KSRSSSSSssSSSSSRSK...","...KSSSShKKKKhSSSSSSK...","...KSSSSSSSSSSSSSSSSK...","...KSSSSSKKKKKKSSSSSK...","....KsSSSSSSSSSSSSsK....",".....KKsSSSSSSSSsKK.....",".......KKKKKKKKKK.......",".....KCCCCWTTWCCCCK.....","....KCCCCCWTTWCCCCCK....","...KCCCCCCWTTWCCCCCCK...","...KCcCCCCCTTCCCCCcCK...","...KCcCCCCCTTCCCCCcCK...","...KCcCCCCCCCCCCCCcCK...","..KSSKCCCCCCCCCCCCKSSK..","..KSSKCCCCCCCCCCCCKSSK..","...KKKCCCCCCCCCCCCKKK...","......KLLLLLLLLLLK......","......KLLLLKKLLLLK......","......KLLLLKKLLLLK......",".....KKKKKK..KKKKKK....."],"moderator_idle":["........KKKKKKKK........","......KKSSSSSSSSKK......",".....KSSSSSSSSSSSSK.....","....KHSSSSSSSSSSSSHK....","...KHHSSSSSSSSSSSSHHK...","...KSSSSSSSSSSSSSSSSK...","...KSKKKSSSSSSSSKKKSK...","...KSKKKKKSSSSKKKKKSK...","...KSKwKwKKKKKKwKwKSK...","...KSKKKKKSssSKKKKKSK...","...KSSSSSSSssSSSSSSSK...","...KSSSSSKKKKKKSSSSSK...","...KSSSSSSSSSSSSSSSSK...","....KsSSSSSSSSSSSSsK....",".....KKsSSSSSSSSsKK.....",".......KKKKKKKKKK.......",".....KGGCCWTTWCCCCK.....","....KCCGGCWTTWCCCCCK....","...KCCCCGGWTTWCCCCCCK...","...KCcCCCGGTTCCCCCcCK...","... const $=s=>document.querySelector(s),stage=$('#stage');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${s})`}addEventListener('resize',fit);fit();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ---- params: ?a=%23C8693A&b=%233A8CB0&share=72  (share = team A's % of the bar) ---- */
const Q=new URLSearchParams(location.search);
const A=Q.get('a')||'#C8693A';
function hexToHsl(h){const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let hh=0,s=0,l=(mx+mn)/2;if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);hh*=60}return[hh,s,l]}
function hslToHex(h,s,l){const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l),c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
const B=Q.get('b')||(()=>{const[h,s,l]=hexToHsl(A);return hslToHex((h+180)%360,s,l)})();
const share=Math.max(0,Math.min(100,parseFloat(Q.get('share')||'72')));
function shade(h){const[a,s,l]=hexToHsl(h);return hslToHex(a,s,Math.max(0,l*.68))}
function cname(h){const[hh]=hexToHsl(h);return [[15,'RED'],[40,'ORANGE'],[65,'YELLOW'],[160,'GREEN'],[200,'TEAL'],[250,'BLUE'],[290,'PURPLE'],[340,'PINK'],[361,'RED']].find(x=>hh<x[0])[1]}

function sprite(rows,team,scale,hair){const pal=Object.assign({},SP.base,team);if(hair)pal.H=hair;let r='';rows.forEach((row,y)=>{let x=0;while(x<row.length){const ch=row[x];if(ch==='.'){x++;continue}let x2=x;while(x2<row.length&&row[x2]===ch)x2++;r+=`<rect x="${x}" y="${y}" width="${x2-x}" height="1" fill="${pal[ch]}"/>`;x=x2}});
 return `<svg width="${rows[0].length*scale}" height="${rows.length*scale}" viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges">${r}</svg>`}
const TA={C:A,c:shade(A),H:'#3B2A20',h:'#24180F'},TB={C:B,c:shade(B),H:'#A88A4A',h:'#6E5A2E'};

 place($('#sA'),sprite(SP.s.cand_a_talk,TA,7),150,262);

 [[40,7,0,.55],[110,9,50,1]].forEach(([yy,sc,off,dim])=>{for(let i=0;i<1400;i+=sc*12+6){const xx=i+off-60;const t=xx<540?TA:(xx<700?SP.mod:TB);
